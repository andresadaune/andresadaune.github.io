<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c1e">
  <title>MORGEN · Lichtstudie V5</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="experience" id="experience">
    <canvas id="flow" aria-hidden="true"></canvas>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="text-veil" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="brand-bar">
      <a class="brand" href="#" aria-label="MORGEN, Intro erneut ansehen">MORGEN<span>°</span></a>
    </header>

    <div class="visual" aria-hidden="true">
      <div class="visual__halo"></div>
      <div class="visual__orbit visual__orbit--outer"></div>
      <div class="visual__orbit visual__orbit--inner"></div>
      <div class="visual__membrane"></div>
      <div class="visual__refraction"></div>
      <div class="visual__seed visual__seed--copper"></div>
      <div class="visual__seed visual__seed--sage"></div>
      <div class="visual__heart"></div>
      <div class="visual__glint"></div>
      <div class="visual__pulse visual__pulse--first"></div>
      <div class="visual__pulse visual__pulse--second"></div>
      <div class="visual__ripple"></div>
    </div>
    <div class="impact-light" aria-hidden="true"></div>

    <div class="story">
      <p class="story__eyebrow">MORGEN BEGINNT MIT EINEM WUNSCH</p>
      <h1><span class="story__line story__line--one">Wenn aus zwei Liebenden</span><span class="story__line story__line--two">ein neues Leben</span><span class="story__line story__line--three">werden soll.</span></h1>
      <p class="story__second">…dann zählt, was ihr heute dafür tut.</p>
    </div>
    <button class="enter" id="enter" type="button"><span>Wir sind bereit</span><span class="enter__arrow" aria-hidden="true">↗</span></button>

    <span class="sound-hint" id="sound-hint" aria-hidden="true">Ton einschalten</span>
    <button class="sound" id="sound" type="button" aria-label="Ton ausschalten" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/><path class="sound__wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/><path class="sound__slash" d="m16 9 5 6M21 9l-5 6"/></svg>
    </button>
    <div class="flying-light" id="flying-light" aria-hidden="true"></div>

    <section class="handoff" aria-label="Beginn der Seite">
      <div class="handoff__symbol" aria-hidden="true"><span></span><span></span></div>
      <p>EUER WUNSCH. EURE GESCHICHTE.</p>
      <h2>Kinderwunsch?</h2>
      <span>Ein großer Wunsch. Und manchmal so viele Fragen.</span>
      <button id="replay" type="button">Intro noch einmal ansehen <span aria-hidden="true">↺</span></button>
    </section>
  </main>
  <script src="./main.js" defer></script>
</body>
</html>
